[project]
name = "deeper-notebook"
# NOTE (v0.8.70): this is the UPSTREAM open-notebook / Docker image version,
# consumed by .github/workflows/build-and-release.yml to tag the server
# container image. It is a SEPARATE track from the Plus DESKTOP app version,
# which lives in desktop/__init__.py (`__version__`, currently on the 0.8.x
# fork line) and drives the window/`/api/version`/update-notifier baseline.
# Do not "reconcile" the two — they intentionally version different artifacts.
version = "1.8.5"
description = "Local-first, source-grounded research and personal knowledge workspace"
authors = [
    {name = "Luis Novo", email = "lfnovo@gmail.com"}
]
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn>=0.24.0",
    "pydantic>=2.9.2",
    "loguru>=0.7.2",
    "langchain>=1.3.9",
    # v0.7.122 — bumped from >=1.0.5 to remediate CVE-2026-28277
    "langgraph>=1.0.10",
    "tiktoken>=0.12.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.14",
    "langchain-anthropic>=1.4.6",
    "langchain-ollama>=1.0.1",
    "langchain-google-genai>=4.1.2",
    "langchain-groq>=1.1.1",
    "langchain_mistralai>=1.1.1",
    "langchain_deepseek>=1.0.0",
    "tomli>=2.0.2",
    # v0.7.122 — bumped from >=1.0.1 to remediate CVE-2026-28684
    "python-dotenv>=1.2.2",
    "httpx[socks]>=0.27.0",
    "content-core>=1.14.1,<2",
    "ai-prompter>=0.4,<1",
    "esperanto>=2.20.0,<3",
    "surrealdb>=1.0.4",
    "podcast-creator>=0.12.0,<1",
    "surreal-commands>=1.3.1,<2",
    "numpy>=2.4.1",
    "pycountry>=26.2.16",
    "babel>=2.18.0",
    # v0.7.124 — Prometheus client for the /metrics endpoint. Pure
    # Python, no native compilation, ~30 KB. The official client and
    # the only one with stable histogram-bucket semantics + multiprocess
    # support (we don't use multiprocess today but it's the standard).
    "prometheus-client>=0.20.0",
    # v0.8.0 — MCP (Model Context Protocol) client for connecting to
    # MCP servers. Used by Phase 2 to enable chat graph to call external
    # MCP tools (web search, fetch, etc.) via streamable-http transport.
    "mcp>=1.28.1,<2",
    # v0.7.122 — Explicit pins for transitive deps with known CVEs.
    # These come in via langchain-* / fastapi / content-core / httpx
    # at versions below their published fix. Pinning here forces uv
    # to resolve the higher version when the lockfile is regenerated.
    "langchain-core>=1.3.3",        # CVE-2026-44843
    "langsmith>=0.8.18",            # CVE-2026-45134
    "lxml>=6.1.0",                  # CVE-2026-41066
    "urllib3>=2.7.0",               # CVE-2026-44431 + 44432
    "python-multipart>=0.0.31",     # CVE-2026-42561 (file-upload library)
    "starlette>=1.2.1",             # CVE-2026-48710 (BadHost)
    # DN-DEP-SEC-2026-08-11 — direct floors keep uv from regressing transitive packages.
    "aiohttp>=3.14.3",
    "authlib>=1.6.12",
    "click>=8.3.3",
    "cryptography>=50.0.0",
    "idna>=3.15",
    "langchain-classic>=1.0.7",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-sdk>=0.3.15",
    "lxml-html-clean>=0.4.5",
    "pyasn1>=0.6.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    # DN-DEP-PIP-2026-08-11 — ai-prompter pulls pip as build tooling; keep
    # the resolved installer above published PYSEC fixes.
    "pip>=26.1.2",
    "soupsieve>=2.8.4",
    # v0.8.70 — Managed local-model snapshot installs call
    # huggingface_hub.snapshot_download directly.
    "huggingface-hub>=1.3.0",
    # Security exception (DN-DEP-PILLOW-2026-08-11): Pillow>=12.3.0 cannot resolve
    # podcast-creator 0.12.0 -> moviepy>=2.2.1 -> Pillow<12; retain floor, report residuals, no overrides.
    "pillow>=11.3.0,<12.0",
    "python-docx>=1.2.0,<2.0",
    "python-pptx>=1.0.2,<2.0",
    "openpyxl>=3.1.5,<4.0",
    # v0.8.117 — text-flow PDF for course-pack exports (pure Python, no system libs).
    "reportlab>=4.2,<6.0",
    "watchdog>=6.0.0,<7.0", "pyyaml>=6.0.3,<7",  # direct vault parser dependency
    "fsrs>=6.3.1,<7.0", "markdown-it-py>=4.0.0,<5",  # direct vault parser dependency
    # Deterministic local Video Overview composition uses the package-managed
    # FFmpeg executable; no system FFmpeg installation is assumed.
    "imageio-ffmpeg>=0.6.0,<1.0",
    # Task 16 — native Anki package writer; pinned for deterministic model/note semantics.
    "genanki==0.13.1",
]

[tool.setuptools.packages.find]
include = ["deeper_notebook*", "open_notebook*"]

[tool.setuptools.package-data]
deeper_notebook = [
    "ai/assets/*.mp3",
    "database/migrations/*.surrealql",
    "prompt_optimizer/*.yaml",
    "prompt_optimizer/skillopt_prompts/*.md",
]


[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "ruff>=0.5.5",
    "mypy>=1.11.1",
    "types-requests>=2.32.0.20241016",
    "ipywidgets>=8.1.5",
    "pre-commit>=4.0.1",
    "pytest>=9.0.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.13",
    "types-requests>=2.32.4.20250913",
]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# v0.7.116 — added UP006 (PEP 585: List → list, Dict → dict) and UP007
# (PEP 604: Optional[X] → X | None, Union[A,B] → A | B) so future code
# stays modernized. Python 3.11+ supports both.
select = ["E", "F", "I", "UP006", "UP007"]
ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top of file (Streamlit requires this pattern)
    "E722",  # do not use bare except (legacy code pattern)
    "F401",  # imported but unused (may be used in type hints or re-exports)
    "F541",  # f-string without placeholders
    "F841",  # local variable assigned but never used
]

[tool.ruff.lint.per-file-ignores]
# Streamlit files need nest_asyncio.apply() before imports
"app_home.py" = ["E402"]
"pages/**/*.py" = ["E402"]

[tool.mypy]
# Exclude Streamlit UI pages from type checking
[[tool.mypy.overrides]]
module = "pages.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["desktop/tests", "tests"]
# v0.7.129 — Custom markers. Tests marked `integration_surreal` run
# against a real SurrealDB instance (started via docker compose by
# CI) and are SKIPPED by default in local pytest runs. Run them with
# `SURREAL_INTEGRATION=1 uv run pytest -m integration_surreal`.
markers = [
    "integration_surreal: requires a live SurrealDB (skipped unless SURREAL_INTEGRATION=1)",
]
